version: "3.8"

services:
  elasticsearch:
    image: elasticsearch:9.2.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "9200:9200"


  kibana:
    image: kibana:9.2.2
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"

  log-analyzer:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8080:8080"
